<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тесла_Н — вариант с бегущим светом</title>
<meta name="theme-color" content="#030508">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=Tektur:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #030508;
    --paper: #f2f8ff;
    --mist: #a9b6c6;
    --volt: #2f8dff;
    --volt-hot: #a9d2ff;
    --pad: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: #fff; -webkit-text-size-adjust: 100%; }
  body { font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  h1, .nav, .btn { font-family: "Tektur", "Onest", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }

  .hero { position: relative; height: 100svh; min-height: 620px; overflow: hidden; background: var(--ink); isolation: isolate; }

  /* Сцена: фон и линии рисует код на холсте; поверх — тень, отражения, машины и блики на кузовах */
  .scene { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene .cars-layer { z-index: 1; }
  .stage {
    --sw: min(100vw, 560px);
    --ratio: 1.2082;   /* ширина к высоте вырезанной картинки */
    --mid: .338;       /* где по высоте картинки середина машин */
    position: absolute; width: var(--sw); height: calc(var(--sw) / var(--ratio));
    left: calc(50% - var(--sw) / 2);
    top: calc(47% - var(--sw) / var(--ratio) * var(--mid));
  }

  .top {
    position: absolute; z-index: 4; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
    padding: calc(18px + env(safe-area-inset-top)) var(--pad) 0;
  }
  .brand { display: block; padding-top: 8px; flex: none; }
  .brand img { display: block; height: clamp(11px, 3.5vw, 15px); width: auto; }
  .burger { position: relative; z-index: 6; width: 44px; height: 44px; margin: -4px -10px 0 0; padding: 0; border: 0; background: none; color: #fff; cursor: pointer; }
  .burger::before, .burger::after { content: ""; position: absolute; left: 10px; right: 10px; height: 2px; border-radius: 2px; background: currentColor; transition: transform .25s, top .25s; }
  .burger::before { top: 17px; } .burger::after { top: 26px; }
  .burger[aria-expanded="true"]::before { top: 21px; transform: rotate(45deg); }
  .burger[aria-expanded="true"]::after { top: 21px; transform: rotate(-45deg); }
  .nav {
    position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: center; gap: 6px;
    padding: 90px var(--pad) 40px; font-size: 26px; font-weight: 500; color: #fff;
    background: rgba(3, 5, 8, .93); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s;
  }
  .nav.is-open { opacity: 1; visibility: visible; }
  .nav-row { display: contents; }
  .nav a { padding: 12px 0; white-space: nowrap; border-bottom: 1px solid rgba(255, 255, 255, .1); }

  .content {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + clamp(104px, 15svh, 146px)) var(--pad) calc(20px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .content > * { pointer-events: auto; }
  .copy { text-align: center; }
  h1 { margin: 0; font-weight: 600; font-size: clamp(22px, 7.4vw, 48px); line-height: 1.12; letter-spacing: -.005em; white-space: nowrap; }
  .copy p { margin: .6em 0 0; font-size: clamp(15px, 4.6vw, 21px); color: var(--mist); }

  .actions { display: grid; gap: 12px; width: 100%; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    height: 58px; border-radius: 15px; font-size: 17px; font-weight: 600; letter-spacing: .005em; white-space: nowrap;
    transition: box-shadow .25s, background-color .25s, transform .12s;
  }
  .btn svg { width: 22px; height: 22px; flex: none; transition: transform .25s; }
  .btn--main { background: var(--paper); color: #05080d; box-shadow: 0 0 0 1.5px #8fc4ff, 0 0 18px rgba(47, 141, 255, .8), 0 0 56px rgba(47, 141, 255, .3); }
  .btn--line { border: 1.5px solid rgba(255, 255, 255, .8); background: rgba(3, 5, 8, .42); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .btn:active { transform: scale(.985); }
  @media (hover: hover) {
    .nav a:hover { color: var(--volt-hot); }
    .btn:hover svg { transform: translateX(5px); }
    .btn--main:hover { box-shadow: 0 0 0 1.5px var(--volt-hot), 0 0 26px rgba(47, 141, 255, 1), 0 0 84px rgba(47, 141, 255, .45); }
    .btn--line:hover { background: rgba(255, 255, 255, .09); }
  }
  :focus-visible { outline: 2px solid var(--volt-hot); outline-offset: 3px; border-radius: 6px; }
  .btn:focus-visible { border-radius: 15px; }

  @media (max-width: 400px) { :root { --pad: 18px; } }
  /* Невысокий экран телефона (браузер с панелями): машины чуть ниже и меньше, чтобы между текстом и залом осталось место под лампы */
  @media (max-aspect-ratio: 999/1000) and (min-aspect-ratio: 13/25) {
    .stage { --sw: min(100vw, 560px); top: calc(52.5% - var(--sw) / var(--ratio) * var(--mid)); }
  }
  @media (max-width: 340px) {
    :root { --pad: 16px; }
    .top { gap: 10px; }
  }

  /* Горизонтальный экран: та же схема — заголовок сверху, машины по центру, кнопки снизу в ряд */
  @media (min-aspect-ratio: 1/1) {
    :root { --pad: clamp(28px, 3.9vw, 76px); }
    .hero { min-height: 540px; }
    .stage { --sw: min(84vw, 1300px, (100svh - 330px) * 2.649); --ratio: 1.7853; --mid: .386; top: calc(51% - var(--sw) / var(--ratio) * var(--mid)); }
    .top { align-items: center; padding-top: calc(clamp(20px, 2.9svh, 34px) + env(safe-area-inset-top)); }
    .brand { padding: 0; }
    .brand img { height: clamp(16px, 1.42vw, 25px); }
    .burger { display: none; }
    .nav { position: static; flex-direction: row; justify-content: flex-end; padding: 0; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; opacity: 1; visibility: visible; gap: clamp(22px, 3.3vw, 64px); font-size: clamp(14px, 1.2vw, 21px); color: #e8eef6; }
    .nav a { padding: 5px 0; border: 0; }
    .content { padding-top: calc(env(safe-area-inset-top) + clamp(86px, 12.6svh, 150px)); padding-bottom: calc(clamp(22px, 4.4svh, 46px) + env(safe-area-inset-bottom)); }
    h1 { font-size: clamp(32px, 3.95vw, 74px); line-height: 1.08; }
    h1 br { display: none; }
    .copy p { font-size: clamp(17px, 1.6vw, 29px); margin-top: .5em; }
    .actions { width: auto; grid-auto-flow: column; grid-auto-columns: clamp(250px, 21.5vw, 350px); gap: clamp(14px, 1.4vw, 24px); }
    .btn { height: clamp(52px, 7svh, 68px); font-size: clamp(16px, 1.16vw, 21px); }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="scene" aria-hidden="true">
    <canvas class="bg-layer"></canvas>
    <div class="stage"></div>
    <canvas class="cars-layer"></canvas>
  </div>

  <header class="top">
    <a class="brand" href="#"><img src="assets/logo-wordmark.webp" alt="Тесла_Н" width="1027" height="132"></a>
    <button class="burger" type="button" aria-label="Меню" aria-expanded="false" aria-controls="site-nav"></button>
    <nav class="nav" id="site-nav" aria-label="Разделы сайта">
      <div class="nav-row">
        <a href="#cars">Автомобили</a>
        <a href="#order">Заказ</a>
        <a href="#service">Сервис</a>
      </div>
      <div class="nav-row">
        <a href="#about">О нас</a>
        <a href="#benefits">Преимущества</a>
        <a href="#contacts">Контакты</a>
      </div>
    </nav>
  </header>

  <div class="content">
    <div class="copy">
      <h1>Электромобили<br> в наличии и под заказ</h1>
      <p>Продажа и сервис в Новосибирске</p>
    </div>
    <div class="actions">
      <a class="btn btn--main" href="#cars">Автомобили в наличии
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13.5 6.5 19 12l-5.5 5.5"/></svg>
      </a>
      <a class="btn btn--line" href="#service">Записаться на сервис
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13.5 6.5 19 12l-5.5 5.5"/></svg>
      </a>
    </div>
  </div>
</section>

<script>
/* Меню на телефоне: кнопка открывает и закрывает список разделов */
(function () {
  var btn = document.querySelector('.burger'), nav = document.getElementById('site-nav');
  if (!btn || !nav) return;
  function set(open) { nav.classList.toggle('is-open', open); btn.setAttribute('aria-expanded', open ? 'true' : 'false'); btn.setAttribute('aria-label', open ? 'Закрыть меню' : 'Меню'); }
  btn.addEventListener('click', function () { set(!nav.classList.contains('is-open')); });
  nav.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
})();
</script>

<script>
/* Главный экран: тёмный фон, пол с отражением и световые линии рисуются кодом (WebGL).
   Линии идут горизонтально на высотах, заданных в долях картинки с машинами, поэтому
   остаются на своих местах при любом размере экрана. Машины лежат сверху отдельной картинкой
   и закрывают линии, которые проходят за ними. */
(function () {
  'use strict';
  var hero = document.getElementById('hero');
  if (!hero) return;
  var scene = hero.querySelector('.scene'), stageEl = hero.querySelector('.stage'), rimEl = hero.querySelector('.rim');
  var canvas = scene.querySelector('canvas.bg-layer');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var qs = new URLSearchParams(location.search);
  var frozen = qs.has('t') ? parseFloat(qs.get('t')) : null;

  /* Одна световая линия за машинами. y — её средняя высота в долях картинки с машинами (0 — верх, 1 — низ),
     amp — размах волн в тех же долях, horizon — где пол встречается со стеной,
     ceil — где стена встречается с потолком, lampFade — до какой высоты видны ряды ламп, lampGap — шаг ламп в ряду,
     w — толщина, g — яркость, sp — скорость блика, который бежит по линии, ph — сдвиг фазы. */
  var LAYOUTS = {
    mobile:  { horizon: .247, ceil: .085, lampFade: [3.1, 3.5], lampGap: .40, lines: [{ y: .150, amp: .070, w: 1.15, g: 0, sp: .075, ph: .12 }] },
    desktop: { horizon: .357, ceil: .235, lampFade: [2.6, 3.0], lampGap: .62, lines: [{ y: .285, amp: .085, w: 1.15, g: 0, sp: .060, ph: .12 }] }
  };
  /* Волны разной длины (в ширинах экрана) и скорости, часть бежит навстречу: рисунок не повторяется */
  var WAVES = [
    { len: 1.42, amp: .50, speed: .34,  ph: 0.0 },
    { len: .66,  amp: .29, speed: -.48, ph: 1.7 },
    { len: .39,  amp: .15, speed: .70,  ph: 3.9 },
    { len: .23,  amp: .06, speed: -.98, ph: 5.2 }
  ];
  var SAMPLES = 220;
  /* f — положение по ширине экрана (0…1), ответ от −1 до 1 */
  function waveAt(f, t) {
    var sum = 0;
    for (var k = 0; k < WAVES.length; k++) { var wv = WAVES[k]; sum += wv.amp * Math.sin(6.2832 * f / wv.len + wv.ph + t * wv.speed); }
    return sum * (.78 + .22 * Math.sin(6.2832 * f / 2.3 + 1.1 + t * .11));
  }
  [LAYOUTS.mobile, LAYOUTS.desktop].forEach(function (lay) {
    lay.lines.forEach(function (line, idx) {
      line.verts = new Float32Array(SAMPLES * 2 * 6);
      line.seed = (idx * .37 + line.ph) % 1;
      line.bursts = [];
      line.cy = 0;
      line.xs = new Float32Array(SAMPLES); line.ys = new Float32Array(SAMPLES);
    });
  });

  /* ---------- шейдеры ---------- */
  var HP = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';
  var LINE_VS =
    'attribute vec2 a_c; attribute vec2 a_n; attribute vec2 a_uv;' +
    'uniform vec2 u_res; uniform float u_hw; varying vec2 v_uv; varying vec2 v_pos;' +
    'void main(){ vec2 p = a_c + a_n * a_uv.y * u_hw; v_pos = p; vec2 c = p / u_res * 2.0 - 1.0; gl_Position = vec4(c.x, -c.y, 0.0, 1.0); v_uv = a_uv; }';
  var LINE_FS = HP +
    'varying vec2 v_uv; varying vec2 v_pos;' +
    'uniform float u_time, u_seed, u_gain, u_core, u_reveal;' +
    'uniform vec2 u_pulse; uniform vec4 u_burst[4]; uniform vec4 u_ptr;' +   /* u_ptr: x, y, радиус в пикселях, сила наведения */
    'float bell(float x){ return exp(-x * x); }' +
    'void main(){' +
    '  float t = v_uv.x; float d = abs(v_uv.y);' +
    '  float ends = smoothstep(0.0, 0.06, t) * smoothstep(1.0, 0.94, t);' +
    '  float shown = 1.0 - smoothstep(u_reveal - 0.05, u_reveal, t);' +
    '  float head = bell((t - u_reveal) / 0.035) * (1.0 - step(1.2, u_reveal));' +
    '  float flow = 0.70 + 0.30 * sin(t * 9.0 - u_time * 1.1 + u_seed * 6.2831);' +
    '  float p = 0.55 * bell((t - u_pulse.x) / 0.055);' +
    '  for (int i = 0; i < 4; i++) { vec4 b = u_burst[i]; p += b.z * bell((abs(t - b.x) - b.y * b.w) / 0.03); }' +
    '  vec2 dp = (v_pos - u_ptr.xy) / u_ptr.z;' +
    '  float near = u_ptr.w * exp(-dot(dp, dp));' +                           /* курсор рядом: линия светится сильнее, форма не меняется */
    '  float core = bell(d / u_core);' +
    '  float glow = exp(-d * 4.4) * (1.0 - smoothstep(0.7, 1.0, d));' +
    '  vec3 blue = vec3(0.05, 0.47, 1.0);' +
    '  vec3 col = blue * glow * 0.46 * (flow + p * 1.7 + near * 2.6) + mix(blue, vec3(1.0), 0.72) * core * (0.9 + p + near * 1.4);' +
    '  gl_FragColor = vec4(col * ends * (shown + head * 1.6) * u_gain, 1.0);' +
    '}';
  var QUAD_VS = 'attribute vec2 a_p; varying vec2 v_tc; void main(){ v_tc = a_p * 0.5 + 0.5; gl_Position = vec4(a_p, 0.0, 1.0); }';
  var BLUR_FS = 'precision mediump float; varying vec2 v_tc; uniform sampler2D u_tex; uniform vec2 u_dir;' +
    'void main(){ vec3 c = texture2D(u_tex, v_tc).rgb * 0.227027;' +
    ' c += texture2D(u_tex, v_tc + u_dir * 1.384615).rgb * 0.316216; c += texture2D(u_tex, v_tc - u_dir * 1.384615).rgb * 0.316216;' +
    ' c += texture2D(u_tex, v_tc + u_dir * 3.230769).rgb * 0.070270; c += texture2D(u_tex, v_tc - u_dir * 3.230769).rgb * 0.070270;' +
    ' gl_FragColor = vec4(c, 1.0); }';
  /* Фон: глубокий тёмный градиент, пол с зеркальным отражением свечения линий,
     мягкое пятно света за машинами и под курсором, зерно против полос на градиенте. */
  var BG_FS = HP +
    'varying vec2 v_tc; uniform sampler2D u_tex; uniform vec2 u_px;' +
    'uniform float u_h, u_gain, u_aspect, u_time; uniform vec3 u_ptr; uniform vec3 u_stage; uniform vec4 u_room; uniform vec2 u_text;' +
    'float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }' +
    'void main(){' +
    '  vec2 uv = v_tc;' +
    '  float wallSide = smoothstep(u_h - 0.0015, u_h + 0.0015, uv.y);' +
    '  float dw = clamp((uv.y - u_h) / max(1.0 - u_h, 0.001), 0.0, 1.0);' +
    '  float df = clamp((u_h - uv.y) / max(u_h, 0.001), 0.0, 1.0);' +
    '  vec3 top = vec3(0.006, 0.009, 0.016);' +
    '  vec3 mid = vec3(0.026, 0.048, 0.098); vec3 wallC = vec3(0.010, 0.013, 0.020);' +
    '  vec3 bot = vec3(0.004, 0.006, 0.011);' +
    '  vec3 col = mix(mix(mid * 1.5, mid * 0.42, pow(df, 0.8)), mix(wallC, top, pow(dw, 0.5)), wallSide);' +
    '  vec2 q = vec2((uv.x - u_stage.x) / u_stage.z, (uv.y - u_stage.y) / (u_stage.z * u_aspect * 0.5));' +
    '  col += (1.0 - wallSide) * vec3(0.012, 0.024, 0.052) * exp(-dot(q, q) * 1.5);' +
    '  float vx = abs(uv.x - 0.5) * 2.0; col *= 1.0 - 0.5 * pow(vx, 2.4);' +
    /* зал: длинные потолочные лампы уходят вглубь и сходятся в перспективе, в полу — их размытое отражение */
    '  float yy = uv.y - u_h; float ay = max(abs(yy), 0.0005); float xx = (uv.x - u_stage.x) * u_aspect;' +
    '  float cH = u_room.x; float lz = cH / ay; float lx = xx / ay; float up = step(0.0, yy);' +
    '  float lcx = (fract(lx / u_room.w) - 0.5) * u_room.w;' +
    '  float lcz = (fract((1.0 - lz) / 0.16) - 0.5) * 0.16;' +
    '  float soft = mix(2.6, 1.0, up);' +
    '  float dl = abs(lcx) / (0.020 * soft);' +
    '  float lamp = smoothstep(1.0, 0.3, dl) + 0.32 * exp(-dl * dl * 0.10);' +
    '  float far = mix(1.6, 1.0, up);' +
    '  lamp *= smoothstep(cH * 1.0, cH * (1.0 + (u_room.y - 1.0) * 0.75), ay) * (1.0 - smoothstep(cH * u_room.y * far, cH * u_room.z * far, ay));' +
    /* лампы на потолке гаснут, не доходя до подзаголовка: на любом экране они не заходят под текст */
    '  lamp *= 1.0 - up * smoothstep(u_text.x - u_text.y, u_text.x, uv.y);' +
    /* d: 0 — дальние лампы у стены, 1 — ближние. Фронт света идёт от 0 к 1, потом весь ряд плавно гаснет */
    '  float dd = clamp((1.0 - lz) / max(1.0 - 1.0 / (u_room.y * 1.6), 0.01), 0.0, 1.0);' +
    '  float cyc = fract(u_time / 5.2);' +
    '  float head = cyc / 0.55 * 1.15 - 0.08;' +
    '  float on = 1.0 - smoothstep(head - 0.16, head, dd);' +
    '  on *= 1.0 - smoothstep(0.66, 0.96, cyc);' +
    '  float edge = exp(-pow((dd - head) / 0.07, 2.0)) * step(cyc, 0.62);' +
    '  lamp *= 0.10 + 0.95 * on + 0.75 * edge;' +
    '  col += vec3(0.74, 0.86, 1.0) * lamp * mix(0.20, 0.95, up);' +
    
    /* швы плит на полу и потолке в той же перспективе: по ним читается, что это плоскости, а не пустота */
    '  float gx = u_room.w * 0.5;' +
    '  float sx = 1.0 - smoothstep(0.0, 0.0016 / ay, (0.5 - abs(fract(lx / gx) - 0.5)) * gx);' +
    '  float sz = 1.0 - smoothstep(0.0, 0.0016 * cH / (ay * ay), (0.5 - abs(fract((1.0 - lz) / 0.16) - 0.5)) * 0.16);' +
    '  float plane = smoothstep(0.02, 0.12, ay) * mix(1.0, smoothstep(cH, cH * 1.05, ay), up);' +
    '  col += vec3(0.045, 0.085, 0.170) * max(sx, sz) * plane * mix(0.50, 0.26, up);' +
    '  vec3 b = texture2D(u_tex, uv).rgb;' +
    '  vec3 r = vec3(0.0); float ws = 0.0;' +
    '  for (int i = -4; i <= 4; i++) { float f = float(i); float w = exp(-f * f * 0.10);' +
    '    r += texture2D(u_tex, vec2(uv.x, 2.0 * u_h - uv.y + f * u_px.y * 2.6)).rgb * w; ws += w; }' +
